name: Docker Kubernetes Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Frontend Image
        run: |
          docker build -t raviteja0090/frontend-app:latest ./frontend

      - name: Build Backend Image
        run: |
          docker build -t raviteja0090/backend-app:latest ./backend

      - name: Push Frontend Image
        run: docker push raviteja0090/frontend-app:latest

      - name: Push Backend Image
        run: docker push raviteja0090/backend-app:latest

      - name: Deploy to EC2 K3s
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ~/fullstack-project

            git pull origin main

            docker pull raviteja0090/frontend-app:latest
            docker pull raviteja0090/backend-app:latest

            kubectl apply -f k8s/

            kubectl rollout restart deployment frontend-deployment
            kubectl rollout restart deployment backend-deployment

            kubectl rollout status deployment/frontend-deployment
            kubectl rollout status deployment/backend-deployment

            kubectl get pods
